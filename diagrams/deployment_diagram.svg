<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    .title { font: bold 20px sans-serif; }
    .box { fill: #f7f9fc; stroke: #2b6cb0; stroke-width:2 }
    .cloud { fill: #eef2ff; stroke: #4c51bf; stroke-width:2 }
    .small { font: 12px sans-serif; }
    .label { font: 14px sans-serif; }
    .note { font: 12px italic sans-serif; fill: #555 }
    .arrow { stroke: #333; stroke-width:2; marker-end: url(#arrowhead) }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">PythonProject4 — Deployment Diagram (SVG fallback)</text>

  <!-- AWS cloud box -->
  <rect x="10" y="50" width="1180" height="620" rx="12" class="cloud" />
  <text x="30" y="75" class="label">AWS Cloud</text>

  <!-- Route 53 and CloudFront -->
  <g>
    <rect x="40" y="100" width="200" height="70" rx="8" class="box" />
    <text x="60" y="130" class="label">Route 53 (DNS)</text>

    <rect x="260" y="100" width="220" height="70" rx="8" class="box" />
    <text x="290" y="130" class="label">CloudFront (CDN)</text>
  </g>

  <!-- ALB / WAF -->
  <rect x="500" y="95" width="220" height="80" rx="8" class="box" />
  <text x="540" y="130" class="label">ALB / WAF (HTTPS, ACM)</text>

  <!-- VPC and subnets -->
  <rect x="760" y="90" width="380" height="560" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="780" y="110" class="small">VPC</text>

  <!-- Public Subnet -->
  <rect x="780" y="130" width="320" height="80" rx="6" class="box" />
  <text x="800" y="160" class="label">Public Subnet: ALB</text>

  <!-- Private Subnet cluster -->
  <rect x="780" y="230" width="320" height="160" rx="6" class="box" />
  <text x="790" y="255" class="label">Private Subnets: ECS / EKS Cluster</text>

  <!-- App service inside cluster -->
  <rect x="800" y="280" width="140" height="60" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1" />
  <text x="810" y="305" class="small">App Service</text>
  <text x="810" y="320" class="small">(Nginx + Gunicorn)</text>

  <!-- Worker service -->
  <rect x="960" y="280" width="140" height="60" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1" />
  <text x="970" y="305" class="small">Worker</text>
  <text x="970" y="320" class="small">(Celery)</text>

  <!-- RDS, Redis, EFS inside private -->
  <rect x="800" y="410" width="140" height="70" rx="6" class="box" />
  <text x="820" y="440" class="small">RDS (Aurora/MySQL)</text>

  <rect x="960" y="410" width="140" height="70" rx="6" class="box" />
  <text x="980" y="440" class="small">ElastiCache (Redis)</text>

  <rect x="880" y="500" width="140" height="60" rx="6" class="box" />
  <text x="900" y="535" class="small">EFS (optional)</text>

  <!-- External S3, ECR, GitHub Actions, Monitoring outside VPC -->
  <rect x="40" y="220" width="200" height="60" rx="6" class="box" />
  <text x="70" y="250" class="small">S3 (static, uploads)</text>

  <rect x="40" y="300" width="200" height="60" rx="6" class="box" />
  <text x="70" y="330" class="small">ECR (container registry)</text>

  <rect x="40" y="380" width="200" height="60" rx="6" class="box" />
  <text x="60" y="410" class="small">CI/CD: GitHub Actions</text>

  <rect x="40" y="460" width="300" height="120" rx="8" class="box" />
  <text x="60" y="490" class="small">Monitoring / Logging</text>
  <text x="70" y="510" class="small">Prometheus · Grafana · Sentry · CloudWatch</text>

  <!-- arrows -->
  <line x1="150" y1="170" x2="270" y2="170" class="arrow" />
  <line x1="380" y1="170" x2="500" y2="170" class="arrow" />
  <line x1="610" y1="170" x2="760" y2="170" class="arrow" />
  <line x1="760" y1="170" x2="820" y2="170" class="arrow" />

  <line x1="140" y1="250" x2="800" y2="320" class="arrow" />
  <line x1="170" y1="330" x2="980" y2="350" class="arrow" />
  <line x1="170" y1="410" x2="880" y2="430" class="arrow" />

  <line x1="920" y1="340" x2="920" y2="410" class="arrow" />
  <line x1="840" y1="340" x2="840" y2="480" class="arrow" />

  <!-- notes -->
  <text x="40" y="610" class="note">Notes: RDS Multi-AZ, S3 versioning, ALB with ACM + WAF, private subnets for app/db/redis.</text>

</svg>
