<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <style>
    .pkg { fill:#f3f4f6; stroke:#374151; stroke-width:1.5; rx:8 }
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.0; rx:6 }
    .title { font: bold 14px sans-serif; fill:#0f172a }
    .label { font: 12px sans-serif; fill:#0f172a }
    .arrow { stroke:#0f172a; stroke-width:1.2; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Root files -->
  <g transform="translate(20,20)">
    <rect class="pkg" x="0" y="0" width="420" height="96" />
    <text x="12" y="22" class="title">Root Files</text>
    <text x="16" y="46" class="label">run.py</text>
    <text x="16" y="66" class="label">config.py</text>
    <text x="16" y="86" class="label">requirements.txt, REQUIREMENTS.md</text>
  </g>

  <!-- app package -->
  <g transform="translate(460,20)">
    <rect class="pkg" x="0" y="0" width="880" height="520" />
    <text x="16" y="22" class="title">app (Flask)</text>

    <!-- models -->
    <rect class="box" x="22" y="44" width="320" height="164" />
    <text x="36" y="68" class="label">models</text>
    <text x="36" y="92" class="label">• BrandInfo</text>
    <text x="36" y="112" class="label">• InstrumentPost</text>
    <text x="36" y="132" class="label">• User, Comment, Like</text>
    <text x="36" y="152" class="label">• MyInstrument, GenreTag</text>

    <!-- routes -->
    <rect class="box" x="366" y="44" width="340" height="92" />
    <text x="380" y="68" class="label">routes</text>
    <text x="380" y="92" class="label">routes.py, routes_auth.py, user.py</text>

    <!-- services -->
    <rect class="box" x="22" y="228" width="280" height="112" />
    <text x="36" y="252" class="label">services</text>
    <text x="36" y="276" class="label">• PostService, FeedService, AuthService</text>

    <!-- repositories -->
    <rect class="box" x="322" y="228" width="200" height="112" />
    <text x="338" y="252" class="label">repositories</text>
    <text x="338" y="276" class="label">• PostRepository, UserRepository</text>

    <!-- adapters -->
    <rect class="box" x="552" y="228" width="220" height="112" />
    <text x="566" y="252" class="label">adapters</text>
    <text x="566" y="276" class="label">• YouTubeAdapter</text>

    <!-- static/templates -->
    <rect class="box" x="22" y="364" width="320" height="132" />
    <text x="36" y="388" class="label">templates / static</text>
    <text x="36" y="412" class="label">templates/*.html</text>
    <text x="36" y="436" class="label">static/view_post.js, uploads/</text>

    <!-- migrations -->
    <rect class="box" x="366" y="364" width="406" height="132" />
    <text x="380" y="388" class="label">migrations</text>
    <text x="380" y="412" class="label">alembic.ini, versions/...</text>
  </g>

  <!-- scripts & diagrams -->
  <g transform="translate(20,160)">
    <rect class="pkg" x="0" y="140" width="420" height="110" />
    <text x="12" y="164" class="title">scripts</text>
    <text x="16" y="188" class="label">scripts/render_plantuml.py</text>
    <text x="16" y="208" class="label">scripts/generate_pdf_from_md.py</text>
  </g>

  <g transform="translate(20,300)">
    <rect class="pkg" x="0" y="0" width="420" height="110" />
    <text x="12" y="24" class="title">diagrams</text>
    <text x="16" y="48" class="label">*.puml, *.png, *.svg</text>
    <text x="16" y="72" class="label">package_diagram.*, class_diagram.*</text>
  </g>

  <!-- WebApplication1 (C#) -->
  <g transform="translate(20,440)">
    <rect class="pkg" x="0" y="0" width="420" height="90" />
    <text x="12" y="22" class="title">WebApplication1 (C#)</text>
    <text x="16" y="46" class="label">Program.cs, WebApplication1.csproj</text>
  </g>

  <!-- External systems -->
  <g transform="translate(1160,40)">
    <rect class="pkg" x="0" y="0" width="220" height="120" />
    <text x="12" y="24" class="title">External</text>
    <text x="24" y="52" class="label">YouTube API</text>
    <text x="24" y="76" class="label">Database</text>
  </g>

  <!-- arrows (dependencies) -->
  <line class="arrow" x1="420" y1="68" x2="460" y2="68" />
  <text x="440" y="58" class="label">run.py → app</text>

  <line class="arrow" x1="560" y1="220" x2="560" y2="252" />
  <text x="520" y="238" class="label">routes → services/repositories</text>

  <line class="arrow" x1="820" y1="296" x2="1040" y2="140" />
  <text x="900" y="230" class="label">YouTubeAdapter → YouTube API</text>

  <line class="arrow" x1="540" y1="320" x2="1160" y2="110" />
  <text x="760" y="300" class="label">PostRepository → Database</text>

  <line class="arrow" x1="160" y1="260" x2="160" y2="230" />
  <text x="120" y="245" class="label">scripts ↔ diagrams</text>

  <!-- note -->
  <rect x="460" y="560" width="760" height="80" rx="6" fill="#fff9db" stroke="#9a3412" />
  <text x="480" y="592" class="label">설명: 이 다이어그램은 프로젝트의 패키지/모듈 경계를
요약합니다. 세부 클래스 관계는 `diagrams/class_diagram.*` 참조.</text>

</svg>
